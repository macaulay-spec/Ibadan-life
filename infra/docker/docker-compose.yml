# ============================================================================
# IBADAN LIFE — local development stack (backend + PostgreSQL)
#   docker compose -f infra/docker/docker-compose.yml up --build
# ============================================================================
services:
  backend:
    build:
      context: ../../backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_DRIVER: postgres
      DATABASE_URL: postgres://ibadan:ibadan@postgres:5432/ibadan_life
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRES_IN: 7d
      ADMIN_TOKEN: dev-admin-token
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ibadan
      POSTGRES_PASSWORD: ibadan
      POSTGRES_DB: ibadan_life
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibadan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
