; ============================================================================
; IBADAN LIFE — DefaultEngine.ini
; Mobile-first (mid-range Android) + dedicated-server networking defaults.
; ============================================================================

[/Script/Engine.Engine]
; We are a client-server game. The client is presentation; the server is truth.
GameEngine=/Script/IbadanLife.ILGameEngine
GameViewportClientClassName=/Script/IbadanLife.ILGameViewportClient
LocalPlayerClassName=/Script/IbadanLife.ILLocalPlayer

[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
; Dedicated authoritative server (Iris replication). No peer-to-peer.
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="OnlineSubsystemUtils.IpNetDriver",bIsUsingNetty=False)
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="Engine.DemoNetDriver",bIsUsingNetty=False)

[SystemSettings]
; --- Mobile-first performance budgets (see PERFORMANCE_AND_MOBILE_TARGETS.md) ---
; Target 60 FPS; hard floor 30 FPS on mid-range Android.
FrameRateLimit=60.0
bSmoothFrameRate=True
SmoothedFrameRateRange=(Lower=22.0,Upper=62.0)
MinDesiredFrameRate=30.0

; Streaming: World Partition + proximity loading (see WORLD_STREAMING_STRATEGY.md)
net.UseAdaptiveNetUpdateFrequency=1
net.UpdateFrequency=60
net.MaxClientUpdateRate=60
net.ClientCap=60

; Network quality for real Nigerian mobile networks (latency/jitter tolerant)
net.PingExcludeFrameTime=1
net.AllowAsyncLoading=1
net.DelayUnmappedRPCs=0

; Memory / garbage collection — keep mobile memory stable
gc.MaxObjectsNotConsideredByGC=0
gc.NumRetriesBeforeForcingGC=5
gc.TimeBetweenPurgingPendingKillObjects=61.0

; Audio
AudioDeviceManagerClassName=/Script/IbadanLife.ILAudioDeviceManager

[/Script/Engine.RendererSettings]
; Mobile rendering: forward-ish, baked lighting (GPU Lightmass), no heavy post.
r.MobileHDR=False
r.MobileMSAA=1
r.MobileNumDynamicPointLights=2
r.MobileDynamicPointLightsUseStaticBranch=True
r.ShadowQuality=2
r.AllowStaticLighting=True
r.GenerateMeshDistanceFields=False
r.VirtualTextures=True
r.Streaming.PoolSize=1000
r.Streaming.LimitPoolSizeToVRAM=1

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Package for mid-range Android (GLES 3.2 / Vulkan where available)
PackageForARM64=True
PackageForX8664=False
PackageForES31=True
MinSDKVersion=24
TargetSDKVersion=34
bSupportsVulkan=1
bSupportsVulkanSM5=0
bAndroidOpenGLSupportsBackbufferSampling=0
AudioSampleRate=44100
AudioCallbackBufferFrameSize=1024
bMultiTargetFormat_ETC2=True
bMultiTargetFormat_DXT=True
bMultiTargetFormat_ASTC=True
Orientation=SensorLandscape
bEnableGooglePlaySupport=False
bBuildForArm64=True
bBuildForX8664=False
bBuildForES31=True
bSupportsVulkanSM5=False
bEnableProguard=True
KeyStore=
KeyAlias=
KeyStorePassword=
KeyPassword=

[/Script/Engine.GameSession]
; Dedicated server session handling
MaxPlayers=128

[/Script/OnlineSubsystemUtils.IpNetDriver]
; Authoritative dedicated server defaults
ServerName=IBADAN-LIFE
MaxClientRate=30000
MaxInternetClientRate=30000
RelevantTimeout=60.0
ConnectionTimeout=60.0
InitialConnectTimeout=60.0
bNoTimeouts=False
bUseNetty=False
NetServerMaxTickRate=60

[/Script/Engine.World]
; World Partition for a large streaming city (see WORLD_STREAMING_STRATEGY.md)
WorldType=Game
bEnableWorldPartition=1
